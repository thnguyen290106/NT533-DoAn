spring.application.name=order
order.instance-id=${INSTANCE_ID:O1}
server.port=8080
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
spring.threads.virtual.enabled=false
spring.web.resources.add-mappings=false
spring.servlet.multipart.enabled=false

management.server.port=8082
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.service=order
management.metrics.tags.instance=${order.instance-id}

order.catalog-url=${CATALOG_URL:http://catalog:8080}
order.inventory-url=${INVENTORY_URL:http://inventory:8080}
spring.jackson.parser.strict-duplicate-detection=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
