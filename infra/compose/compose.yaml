name: nt533
services:
  catalog-1: &catalog
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: catalog
    environment: &catalog-env
      INSTANCE_ID: C1
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx256m -XX:+UseG1GC
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
    networks: [backend]
    healthcheck: &java-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/actuator/health/readiness"]
      interval: 5s
      timeout: 2s
      start_period: 60s
      retries: 3

  catalog-2:
    <<: *catalog
    environment:
      <<: *catalog-env
      INSTANCE_ID: C2

  catalog-3:
    <<: *catalog
    environment:
      <<: *catalog-env
      INSTANCE_ID: C3

  inventory-1: &inventory
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: inventory
    environment: &inventory-env
      INSTANCE_ID: I1
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx256m -XX:+UseG1GC
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
    networks: [backend]
    healthcheck: *java-health

  inventory-2:
    <<: *inventory
    environment:
      <<: *inventory-env
      INSTANCE_ID: I2

  inventory-3:
    <<: *inventory
    environment:
      <<: *inventory-env
      INSTANCE_ID: I3

  order-1: &order
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: order
    environment: &order-env
      INSTANCE_ID: O1
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx256m -XX:+UseG1GC
      CATALOG_URL: http://nginx:8083
      INVENTORY_URL: http://nginx:8083
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
    networks: [backend]
    healthcheck: *java-health

  order-2:
    <<: *order
    environment:
      <<: *order-env
      INSTANCE_ID: O2

  order-3:
    <<: *order
    environment:
      <<: *order-env
      INSTANCE_ID: O3

  nginx:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - target: 8080
        published: "8080"
        host_ip: "${NT533_BIND_IP-127.0.0.1}"
    cpus: 1
    mem_limit: 256m
    restart: unless-stopped
    networks: [edge, backend]
    depends_on:
      catalog-1:
        condition: service_healthy
      catalog-2:
        condition: service_healthy
      catalog-3:
        condition: service_healthy
      inventory-1:
        condition: service_healthy
      inventory-2:
        condition: service_healthy
      inventory-3:
        condition: service_healthy
      order-1:
        condition: service_healthy
      order-2:
        condition: service_healthy
      order-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
    networks: [edge, backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 2s
      start_period: 30s
      retries: 3
  grafana:
    image: grafana/grafana:11.6.0@sha256:62d2b9d20a19714ebfe48d1bb405086081bc602aa053e28cf6d73c7537640dfb
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ../../observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/nt533.yml:ro
      - ../../observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/nt533.yml:ro
      - ../../observability/dashboard.json:/var/lib/grafana/dashboards/nt533.json:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 2s
      start_period: 45s
      retries: 4
networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
volumes:
  prometheus-data:
  grafana-data:
