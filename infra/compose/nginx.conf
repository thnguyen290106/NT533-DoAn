worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    upstream catalog_d2 {
        zone catalog_d2 64k;
        server catalog:8080 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }
    upstream inventory_d2 {
        zone inventory_d2 64k;
        server inventory:8080 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }
    upstream order_d2 {
        zone order_d2 64k;
        server order:8080 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Call-ID "";
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_connect_timeout 200ms;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;

        location = /healthz { return 200 "ok\n"; }
        location = /api/catalog/products { proxy_pass http://catalog_d2; }
        location /api/catalog/products/ { proxy_pass http://catalog_d2; }
        location /api/inventory { proxy_pass http://inventory_d2; }
        location /api/orders { proxy_pass http://order_d2; }
        location / {
            default_type application/json;
            return 404 '{"error":{"code":"ROUTE_NOT_FOUND","message":"Route not found"}}';
        }
    }
}
