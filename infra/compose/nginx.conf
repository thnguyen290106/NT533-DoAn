worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 4096;
}

http {
    map $server_port $nt533_request_id {
        default $request_id;
        8083 $http_x_request_id;
    }

    map $server_port $nt533_call_id {
        default "";
        8083 $http_x_call_id;
    }

    log_format nt533_json escape=json
        '{"timestamp_utc":"$time_iso8601","request_id":"$nt533_request_id",'
        '"call_id":"$nt533_call_id","route":"$uri","status":$status,'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
        '"peer_ip":"$remote_addr","effective_ip":"$remote_addr",'
        '"request_time_s":"$request_time","upstream_response_time_s":"$upstream_response_time"}';
    access_log /dev/stdout nt533_json;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    upstream catalog_rr {
        zone catalog_rr 64k;
        server catalog-1:8080 max_fails=1 fail_timeout=5s;
        server catalog-2:8080 max_fails=1 fail_timeout=5s;
        server catalog-3:8080 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }
    upstream inventory_rr {
        zone inventory_rr 64k;
        server inventory-1:8080 max_fails=1 fail_timeout=5s;
        server inventory-2:8080 max_fails=1 fail_timeout=5s;
        server inventory-3:8080 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }
    upstream order_rr {
        zone order_rr 64k;
        server order-1:8080 max_fails=1 fail_timeout=5s;
        server order-2:8080 max_fails=1 fail_timeout=5s;
        server order-3:8080 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }
    proxy_http_version 1.1;
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_connect_timeout 200ms;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;

    server {
        listen 8080;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Call-ID "";

        location = /healthz { return 200 "ok\n"; }
        location = /api/catalog/products { proxy_pass http://catalog_rr; }
        location /api/catalog/products/ { proxy_pass http://catalog_rr; }
        location /api/inventory { proxy_pass http://inventory_rr; }
        location /api/orders { proxy_pass http://order_rr; }
        location / {
            default_type application/json;
            return 404 '{"error":{"code":"ROUTE_NOT_FOUND","message":"Route not found"}}';
        }
    }
    server {
        listen 8083;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Call-ID $http_x_call_id;

        location /api/catalog/products/ { proxy_pass http://catalog_rr; }
        location /api/inventory/ { proxy_pass http://inventory_rr; }
        location / { return 404; }
    }
}
