global:
  scrape_interval: 5s
  scrape_timeout: 3s

scrape_configs:
  - job_name: nt533-backends
    metrics_path: /actuator/prometheus
    honor_labels: true
    static_configs:
      - targets: ["catalog-1:8082"]
        labels: {service: catalog, instance: C1}
      - targets: ["catalog-2:8082"]
        labels: {service: catalog, instance: C2}
      - targets: ["catalog-3:8082"]
        labels: {service: catalog, instance: C3}
      - targets: ["inventory-1:8082"]
        labels: {service: inventory, instance: I1}
      - targets: ["inventory-2:8082"]
        labels: {service: inventory, instance: I2}
      - targets: ["inventory-3:8082"]
        labels: {service: inventory, instance: I3}
      - targets: ["order-1:8082"]
        labels: {service: order, instance: O1}
      - targets: ["order-2:8082"]
        labels: {service: order, instance: O2}
      - targets: ["order-3:8082"]
        labels: {service: order, instance: O3}
